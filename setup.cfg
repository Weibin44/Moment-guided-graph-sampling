[metadata]
name = mggs
version = 0.1.0
description = Exact delta moments and moment-guided graph sampling
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = find:
python_requires = >=3.9
install_requires =
    numpy>=1.24
    scipy>=1.10
    torch>=1.13
    torch-geometric>=2.3

[options.packages.find]
include =
    mggs*
    experiments*

[options.extras_require]
fast =
    numba>=0.57
experiments =
    matplotlib>=3.7
    networkx>=3.0
    scikit-learn>=1.2
    threadpoolctl>=3.0
    tqdm>=4.65
test =
    pytest>=7

[options.entry_points]
console_scripts =
    mggs = mggs.cli:main
    mggs-edge-density = experiments.EXP1_edge_direction_density:main
    mggs-sampling-efficiency = experiments.sampling_efficiency:main
    mggs-property-benchmark = experiments.EXP2_graph_property_preservation:main
    mggs-supervised = experiments.EXP3_graph_learning.supervised_node_classification.EXP3_supervised_edge_direction:main
